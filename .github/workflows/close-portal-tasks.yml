# Task board sync
#
# 1. "Closes Task N" -> Done: when a pushed commit message contains "Closes Task N" (also
#    Close/Closed/Fixes/Resolves Task N, "Closes Tasks 1, 3 and 4", "Closes Task #2"), Task N is
#    set to Done on the task portal (salehNassar/agv-task-portal) and the commit is linked as its work.
# 2. Plan table: the "Current plan" table in this repo's README (between <!-- PLAN:START --> and
#    <!-- PLAN:END -->) is regenerated from the portal: people, head-count, dates and status per task.
#
# Runs on pushes that mention a task, every hour (08:00-00:00 Cairo time) and on demand
# (Actions tab > Task board sync > Run workflow).
#
# One-time setup (team leader), needed for step 1 only:
#   1. Create a fine-grained personal access token: Resource owner = salehNassar,
#      Repository access = only "agv-task-portal", Permissions > Contents = Read and write.
#   2. In THIS repository: Settings > Secrets and variables > Actions > New repository secret
#      Name: PORTAL_TOKEN   Value: the token.
# Without the secret, tasks are not closed automatically, but the plan table still updates.

name: Task board sync

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 5-21 * * *'   # hourly at :07, 08:07-00:07 Cairo time (UTC+3)
  workflow_dispatch:

permissions:
  contents: write   # to update the plan table in README.md

concurrency:
  group: portal-board-update
  cancel-in-progress: false

jobs:
  sync:
    # On pushes, only run when a commit message mentions a task (contains() is case-insensitive).
    if: github.event_name != 'push' || contains(join(github.event.commits.*.message, ' '), 'task')
    runs-on: ubuntu-latest
    env:
      PORTAL_TOKEN: ${{ secrets.PORTAL_TOKEN }}
      PORTAL_REPO: salehNassar/agv-task-portal
    steps:
      - name: Check out this repository
        uses: actions/checkout@v5

      - name: Check out the task portal
        uses: actions/checkout@v5
        with:
          repository: ${{ env.PORTAL_REPO }}
          token: ${{ secrets.PORTAL_TOKEN || github.token }}
          path: portal

      - name: Mark closed tasks as Done and publish
        if: github.event_name == 'push' && env.PORTAL_TOKEN != ''
        env:
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
          PORTAL_FILE: portal/data.js
        run: |
          git -C portal config user.name "task-board-bot"
          git -C portal config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # If someone else updated the board at the same moment, start again from the latest version.
          for attempt in 1 2 3; do
            GITHUB_OUTPUT=out.txt python3 .github/scripts/close_portal_tasks.py
            if ! grep -q '^changed=true' out.txt; then echo "Board already up to date."; rm -f out.txt; exit 0; fi
            TASKS=$(sed -n 's/^tasks=//p' out.txt)
            git -C portal add data.js
            git -C portal commit -q -m "Board: Task ${TASKS} done (from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7})"
            if git -C portal push -q; then echo "Board updated: Task ${TASKS} -> Done"; rm -f out.txt; exit 0; fi
            echo "Push rejected (attempt $attempt); retrying on the latest board..."
            BRANCH=$(git -C portal rev-parse --abbrev-ref HEAD)
            git -C portal fetch -q origin "$BRANCH"
            git -C portal reset -q --hard "origin/$BRANCH"
            rm -f out.txt
          done
          echo "::error::Could not update the task board after 3 attempts."
          exit 1

      - name: Note when automatic closing is off
        if: env.PORTAL_TOKEN == '' && github.event_name == 'push'
        run: echo "::notice::PORTAL_TOKEN is not set, so tasks were not closed automatically. The plan table is still updated."

      - name: Write the plan table
        env:
          PORTAL_FILE: portal/data.js
        run: |
          git config user.name "task-board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME:-main}"
          # Someone may push at the same moment: always regenerate on top of the latest commit.
          for attempt in 1 2 3; do
            git fetch -q origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"
            python3 .github/scripts/sync_plan_table.py
            if git diff --quiet -- README.md; then echo "Plan table already up to date."; exit 0; fi
            git add README.md
            git commit -q -m "Sync plan table from the task portal"
            if git push -q origin "HEAD:$BRANCH"; then echo "Plan table updated."; exit 0; fi
            echo "Push rejected (attempt $attempt); retrying..."
          done
          echo "::error::Could not update the plan table after 3 attempts."
          exit 1
